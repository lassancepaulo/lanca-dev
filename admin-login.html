<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — lança.dev</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --purple:#7b61ff;--yellow:#ffd23f;--magenta:#ff2fb3;
  --night:#0d0b1a;--deep:#24205a;--mute:#b4aed4;
  --mono:'JetBrains Mono',monospace;
}
body{
  font-family:'Inter',sans-serif;background:var(--night);color:#fff;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
}
body::before{
  content:'';position:fixed;top:-120px;left:50%;transform:translateX(-50%);
  width:600px;height:400px;
  background:radial-gradient(ellipse,rgba(123,97,255,0.12) 0%,transparent 70%);
  pointer-events:none;
}
.wrap{width:100%;max-width:400px;position:relative;}
.brand{
  display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:36px;
  font-family:var(--mono);font-size:22px;font-weight:700;
}
.brand span{color:var(--yellow);}
.card{
  background:var(--deep);border:2px solid var(--purple);
  box-shadow:6px 6px 0 var(--purple);padding:36px 32px;
}
.title{font-family:var(--mono);font-size:18px;font-weight:700;margin-bottom:4px;}
.sub{font-size:13px;color:var(--mute);margin-bottom:28px;}
.field{margin-bottom:18px;}
.field label{
  display:block;font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;color:var(--mute);margin-bottom:7px;
}
.input-wrap{position:relative;}
.input-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:13px;pointer-events:none;}
.field input{
  width:100%;background:var(--night);border:2px solid rgba(123,97,255,0.4);
  color:#fff;padding:10px 12px 10px 36px;font-family:'Inter',sans-serif;font-size:14px;outline:none;
  transition:border-color 0.15s;
}
.field input:focus{border-color:var(--purple);}
.field input::placeholder{color:rgba(180,174,212,0.4);}
.toggle{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--mute);cursor:pointer;font-size:13px;padding:0;
}
.toggle:hover{color:#fff;}
.err{
  display:none;align-items:center;gap:10px;
  background:rgba(255,47,179,0.1);border:2px solid var(--magenta);
  padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--magenta);
}
.btn{
  width:100%;background:var(--purple);color:#fff;border:2px solid var(--purple);
  box-shadow:4px 4px 0 rgba(123,97,255,0.5);padding:12px;
  font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform 0.1s,box-shadow 0.1s;margin-top:4px;
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 rgba(123,97,255,0.5);}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(123,97,255,0.3);}
footer{text-align:center;margin-top:20px;font-size:11px;color:rgba(180,174,212,0.4);font-family:var(--mono);}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 10 10" width="22" height="22" aria-hidden="true" shape-rendering="crispEdges">
      <g fill="#ffd23f">
        <rect x="5" y="1" width="3" height="1"/><rect x="4" y="2" width="3" height="1"/>
        <rect x="3" y="3" width="3" height="1"/><rect x="2" y="4" width="3" height="2"/>
        <rect x="3" y="6" width="3" height="1"/><rect x="4" y="7" width="3" height="1"/>
        <rect x="5" y="8" width="3" height="1"/>
      </g>
    </svg>
    lança<span>.dev</span>
  </div>
  <div class="card">
    <div class="title">Acesso ao painel</div>
    <div class="sub">Área restrita — somente Paulo</div>
    <div class="err" id="err"><i class="fas fa-circle-exclamation"></i> Usuário ou senha incorretos.</div>
    <form onsubmit="doLogin(event)">
      <div class="field">
        <label for="user">Usuário</label>
        <div class="input-wrap">
          <i class="fas fa-user"></i>
          <input type="text" id="user" placeholder="usuário" autocomplete="username" required>
        </div>
      </div>
      <div class="field">
        <label for="pass">Senha</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="toggle" onclick="togglePass()" aria-label="Mostrar senha">
            <i class="fas fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn"><i class="fas fa-arrow-right-to-bracket"></i> Entrar</button>
    </form>
  </div>
  <footer>lança.dev © 2026 — área restrita</footer>
</div>
<script>
const USERS = { lanca: 'lanca2025' };
function doLogin(e) {
  e.preventDefault();
  const u = document.getElementById('user').value.trim();
  const p = document.getElementById('pass').value;
  if (USERS[u] === p) {
    sessionStorage.setItem('lancaAdmin', 'true');
    window.location.href = 'admin/index.html';
  } else {
    const err = document.getElementById('err');
    err.style.display = 'flex';
    setTimeout(() => err.style.display = 'none', 4000);
  }
}
function togglePass() {
  const inp = document.getElementById('pass');
  const ico = document.getElementById('eyeIcon');
  if (inp.type === 'password') { inp.type = 'text'; ico.className = 'fas fa-eye-slash'; }
  else { inp.type = 'password'; ico.className = 'fas fa-eye'; }
}
if (sessionStorage.getItem('lancaAdmin') === 'true') {
  window.location.href = 'admin/index.html';
}
</script>
</body>
</html>
